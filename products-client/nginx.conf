server {
  listen 80;
  root /usr/share/nginx/html;

  # SPA fallback: unknown paths resolve to index.html so client routing works
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
